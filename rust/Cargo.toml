[workspace]
resolver = "2"
members = ["protocol", "daemon", "app", "script-sdk"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 4

# gpui-base with two textarea changes (vendor/gpui-base/PATCHES.md).
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
