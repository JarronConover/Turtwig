[package]
name = "agent-box-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "agent-box"
path = "src/main.rs"

[dependencies]
agent-box-protocol = { path = "../protocol" }
gpui-kit = "0.7.3"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
serde_json_lenient = "0.2"
schemars = "0.8"
alacritty_terminal = "0.26"
base64 = "0.22"
notify = "6"
flume = "0.11"
jaq-core = "3.1"
jaq-std = "3.0"
jaq-json = { version = "2.0", features = ["serde"] }
