[package]
name = "agent-box-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "agent-box"
path = "src/main.rs"

[dependencies]
agent-box-protocol = { path = "../protocol" }
gpui-kit = "0.7.3"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
serde_json_lenient = "0.2"
schemars = "0.8"
alacritty_terminal = "0.26"
base64 = "0.22"
imagesize = "0.13"
resvg = "0.46"
notify = "6"
flume = "0.11"
jaq-core = "3.1"
jaq-std = "3.0"
jaq-json = { version = "2.0", features = ["serde"] }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSDictionary", "NSObject", "NSUserNotification", "NSData", "NSURL", "NSValue", "NSRange", "NSArray"] }
objc2-av-foundation = { version = "0.3", features = ["AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3", features = ["CMTime"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer"] }
objc2-core-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder", "NSWindow", "NSGraphics", "NSImage", "NSSound", "NSSpellChecker"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger", "block2"] }
block2 = "0.6"
