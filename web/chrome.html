<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Box chrome</title>
<style>
  :root {
    --bg: #1a1a1a; --ink: #e8e8e6; --muted: #8d8d89; --faint: #5d5d5a; --line: #2c2c2c; --hover: #262626;
    --tab: #232323; --accent: #4f8cff; --orange: #e3a03b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f5f4; --ink: #1c1c1b; --muted: #6b6b67; --faint: #a3a39f; --line: #e3e3e0; --hover: #ececea; --tab: #ffffff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font: 12.5px/1 -apple-system, BlinkMacSystemFont, sans-serif;
         -webkit-user-select: none; user-select: none; display: flex; flex-direction: column; }
  .strip { flex: 1; display: flex; align-items: center; gap: 6px; padding: 0 10px; min-width: 0; }
  .header .strip { border-bottom: 1px solid var(--line); }
  .badge { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center;
           font-size: 9.5px; font-weight: 650; color: #fff; }
  .crumb { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .sep { color: var(--faint); }
  .tabs { display: flex; gap: 2px; min-width: 0; overflow: hidden; margin-left: 10px; height: 100%; align-items: stretch; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 12px; color: var(--muted); cursor: default;
         border-bottom: 2px solid transparent; white-space: nowrap; max-width: 240px; }
  .tab span { overflow: hidden; text-overflow: ellipsis; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.up { background: #3fb950; }
  .grow { flex: 1; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px;
           padding: 4px 9px; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--hover); }
  button.icon { border: 0; color: var(--muted); padding: 4px 7px; font-size: 14px; }
  button.warn { border-color: #6b4a1a; color: var(--orange); }
  .branch { display: flex; align-items: center; gap: 6px; color: var(--ink); white-space: nowrap; }
  .muted { color: var(--muted); }
  .dirty { color: var(--orange); white-space: nowrap; }
  .bar .strip:first-child { border-bottom: 1px solid var(--line); }
  .ttab { color: var(--muted); padding: 4px 8px; border-radius: 5px; }
  .ttab.on { color: var(--ink); background: var(--tab); border: 1px solid var(--line); }
  #toast { position: fixed; right: 10px; top: 4px; background: var(--ink); color: var(--bg); padding: 5px 9px; border-radius: 6px;
           max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" hidden></div>
<script>
const part = new URLSearchParams(location.search).get("part") || "header";
document.body.className = part;
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.agentbox;
const post = (m) => native && native.postMessage(m);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRANCH = `<svg width="13" height="13" viewBox="0 0 12 12"><circle cx="3" cy="2.5" r="1.3" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="3" cy="9.5" r="1.3" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="9" cy="3.5" r="1.3" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M3 3.8v4.4M9 4.8c0 2.4-6 1.6-6 3.4" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>`;
let sel = null;
let activeChat = null;

window.setSel = (s, chatId) => {
  sel = s;
  activeChat = chatId || (s.chats && s.chats[0] && s.chats[0].id) || null;
  render();
};

function header() {
  if (!sel) return `<div class="strip"><span class="muted">Select a worktree</span></div>`;
  const chats = sel.chats || [];
  const tabs = chats.map((c) => `<div class="tab ${c.id === activeChat ? "on" : ""}" data-chat="${c.id}">
      <span class="dot ${c.alive ? "up" : ""}"></span><span>${esc(c.name)}</span></div>`).join("");
  const none = sel.host === "mac" && !chats.length
    ? `<span class="muted" style="margin-left:10px">This worktree's chat is in super.engineering</span>` : "";
  return `<div class="strip">
    <span class="badge" style="background:hsl(${sel.hue ?? 210} 32% 38%)">${esc(sel.letter || "R")}</span>
    <span class="crumb">${esc(sel.title || sel.worktree)}</span>
    <div class="tabs">${tabs}</div>${none}
    ${sel.host === "box" ? `<button class="icon" data-act="new" title="New chat in this worktree">+</button>` : ""}
    <span class="grow"></span>
    <button data-act="ide">Open in IDE</button></div>`;
}

function bar() {
  if (!sel) return `<div class="strip"></div><div class="strip"><span class="ttab on">Terminal</span></div>`;
  const n = sel.local && sel.local.uncommitted;
  const chat = (sel.chats || []).find((c) => c.id === activeChat);
  const acts = [];
  if (sel.host === "box" && sel.branch && !sel.is_primary) acts.push(`<button data-run='${esc(JSON.stringify(["chat", "test-local", "--branch", sel.branch]))}' title="Check this branch out on the Mac with the box's latest work">Test on Mac</button>`);
  if (chat && chat.host === "box") acts.push(`<button data-run='${esc(JSON.stringify(["chat", "move", chat.id, "--to", "mac"]))}' title="Move this chat to the Mac">Move chat to Mac</button>`);
  if (chat && chat.host === "mac") {
    if (chat.branch) acts.push(`<button data-run='${esc(JSON.stringify(["chat", "stack-start", chat.id]))}'>Start stack</button>`);
    acts.push(`<button data-run='${esc(JSON.stringify(["chat", "move", chat.id, "--to", "box"]))}'>Move chat to box</button>`);
  }
  return `<div class="strip">
      <span class="branch">${BRANCH}${esc(sel.branch || "detached")}</span>
      <span class="muted" style="margin-left:6px">${sel.host === "box" ? "on the box" : "on the Mac"}</span>
      <span class="grow"></span>
      ${n ? `<span class="dirty">${n} uncommitted change${n === 1 ? "" : "s"}</span>` : ""}
      ${acts.join("")}</div>
    <div class="strip"><span class="ttab on">Terminal</span>${sel.host === "mac" ? `<span class="muted">Mac worktrees open in your IDE or Terminal</span>` : ""}</div>`;
}

function render() {
  document.getElementById("root").innerHTML = part === "bar" ? bar() : header();
  document.getElementById("root").style.cssText = `display:flex;flex-direction:column;height:100%`;
}

function toast(text, ms = 6000) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast.t);
  if (ms) toast.t = setTimeout(() => (t.hidden = true), ms);
}
window.agentboxResult = (r) => {
  const out = (r.output || "").trim().split("\n").filter(Boolean).pop();
  toast(out || (r.code === 0 ? "Done" : "Failed"), r.code === 0 ? 7000 : 20000);
};

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-chat],[data-act],[data-run]");
  if (!t || !sel) return;
  if (t.dataset.chat) {
    activeChat = t.dataset.chat;
    render();
    post({ type: "tab", chat: (sel.chats || []).find((c) => c.id === activeChat) });
  } else if (t.dataset.act === "new") {
    post({ type: "newchat", dir: sel.path });
  } else if (t.dataset.act === "ide") {
    post({ type: "open", url: sel.ide });
  } else if (t.dataset.run) {
    t.disabled = true;
    t.textContent = "…";
    toast("Working…", 0);
    post({ type: "run", args: JSON.parse(t.dataset.run), reqId: String(Date.now()) });
  }
});
render();
</script>
</body>
</html>
