<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Box main</title>
<style>
  /* Measured from super.engineering at 1x (points). */
  :root {
    --chrome: #212122; --card: #1e1e1f; --line: #323235; --ink: #f5f5f7; --ink2: #e4e1e0; --muted: #898a8e;
    --muted2: #a9a9ad; --pill: #262628; --pill-line: #323235; --blue: #488efc; --orange: #f0a43a; --claude: #d97757;
    --sel: #272c35; --sel-line: #485262;
    --split: 0.7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--chrome); color: var(--ink);
               font: 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
               -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default; }
  #app { position: absolute; inset: 0 14px 0 0; display: flex; flex-direction: column; }
  #toolbar { flex: none; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 0 0 23px; }
  .stat { width: 6px; height: 6px; border-radius: 50%; background: #5d5d60; flex: none; }
  .stat.up { background: #3fb950; }
  .pbadge { position: relative; flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center;
            font-size: 9.5px; font-weight: 600; color: #afbdcc; background: #324051; margin-left: 2px; }
  .pbadge .agent { position: absolute; right: -5px; bottom: -4px; width: 11px; height: 11px; }
  .crumb { color: var(--ink); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; margin-left: 6px; }
  .chev { color: #6c6c70; font-size: 12px; }
  .crumb2 { color: var(--muted2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
  .odot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); flex: none; }
  .grow { flex: 1; }
  .pills { display: flex; gap: 6px; align-items: center; }
  .pill { height: 26px; border-radius: 13px; border: 1px solid var(--pill-line); background: var(--pill); color: var(--ink);
          display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 12.5px; white-space: nowrap; }
  .pill:hover { background: #2c2c2f; }
  .pill .dd { color: #77777b; font-size: 10px; border-left: 1px solid var(--pill-line); padding-left: 7px; margin-left: 2px; height: 14px; display: flex; align-items: center; }
  .pill.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  svg { display: block; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 13px; position: relative; overflow: hidden; }
  #chatcard { flex: var(--split) 1 0; min-height: 120px; display: flex; flex-direction: column; }
  .tabs { flex: none; height: 40px; display: flex; align-items: stretch; border-bottom: 0; padding-left: 8px; }
  .tab { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 12px; color: var(--muted2); min-width: 120px; max-width: 260px; }
  .tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .tab.on { color: var(--ink2); }
  .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--blue); border-radius: 1px; }
  .tab:hover { color: var(--ink2); }
  .tsep { width: 1px; background: var(--line); margin: 10px 4px; }
  .newtab { display: flex; align-items: center; gap: 5px; padding: 0 10px; color: var(--muted); }
  .newtab:hover { color: var(--ink2); }
  .hist { display: flex; align-items: center; padding: 0 14px; color: var(--muted); border-left: 1px solid var(--line); margin: 8px 0; }
  .hole { flex: 1; position: relative; }
  #termhole { margin: 0 6px 0 14px; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.5; }

  #branchbar { flex: none; height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 16px; cursor: row-resize; }
  #branchbar > * { cursor: default; }
  .bname { color: var(--ink2); font-size: 13px; }
  .bico { color: #8e8e92; }
  .dirty { color: var(--orange); font-size: 12.5px; }
  .btn { height: 26px; border-radius: 7px; border: 1px solid #5a4a2a; background: #2a2418; color: #f2c27a; display: flex; align-items: center;
         gap: 6px; padding: 0 9px; font-size: 12.5px; }
  .btn.plain { border-color: var(--pill-line); background: var(--pill); color: var(--ink); }
  .btn:hover { filter: brightness(1.12); }

  #termcard { flex: calc(1 - var(--split)) 1 0; min-height: 90px; display: flex; flex-direction: column; border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 0; }
  .ptabs { flex: none; height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 14px 0 18px; }
  .ptab { height: 26px; display: flex; align-items: center; padding: 0 11px; border-radius: 13px; color: var(--muted2); font-size: 13px; border: 1px solid transparent; }
  .ptab.on { color: var(--ink2); background: #22262e; border-color: #3b4350; }
  .ptab:hover { color: var(--ink2); }
  .padd { color: var(--muted); padding: 0 6px; font-size: 16px; }
  #toast { position: fixed; right: 26px; top: 52px; background: #f5f5f7; color: #1e1e1f; padding: 7px 11px; border-radius: 8px;
           max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 9; font-size: 12.5px; }
  .menu { position: fixed; z-index: 10; background: #2a2a2d; border: 1px solid #3a3a3e; border-radius: 9px; padding: 5px; min-width: 190px;
          box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .menu div { padding: 7px 10px; border-radius: 6px; color: var(--ink2); }
  .menu div:hover { background: var(--blue); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar"></div>
  <div id="chatcard" class="card">
    <div class="tabs" id="tabs"></div>
    <div class="hole" id="chathole"><div class="empty" id="chatempty"></div></div>
  </div>
  <div id="branchbar"></div>
  <div id="termcard" class="card">
    <div class="ptabs" id="ptabs"></div>
    <div class="hole" id="termhole"><div class="empty" id="termempty"></div></div>
  </div>
</div>
<div id="toast" hidden></div>
<script>
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.agentbox;
const post = (m) => native && native.postMessage(m);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const ICON = {
  claude: (s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><g stroke="#d97757" stroke-width="2.6" stroke-linecap="round">${
    [0, 30, 60, 90, 120, 150].map((a) => `<line x1="12" y1="3" x2="12" y2="21" transform="rotate(${a} 12 12)"/>`).join("")}</g></svg>`,
  plus: `<svg width="9" height="9" viewBox="0 0 10 10"><path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  chev: `<svg width="9" height="9" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  clock: `<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.5V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  branch: `<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="4.5" cy="12.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="11.5" cy="5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 5.2v5.6M11.5 6.7c0 3-7 2-7 4.1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>`,
  sync: `<svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1.5v6M3.5 5L6 7.5 8.5 5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="10" r="1.1" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>`,
  commit: `<svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 10.5V3M3.3 5.6L6 2.9l2.7 2.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 11h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`,
  cube: `<svg width="15" height="15" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="#111"/><path d="M8 4l3.5 2v4L8 12 4.5 10V6z" fill="#e8e8e8"/><path d="M8 8l3.5-2M8 8v4M8 8L4.5 6" stroke="#111" stroke-width=".8"/></svg>`,
  play: `<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 2l7 4-7 4z" fill="none" stroke="#3fb950" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
  term: `<svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="12" rx="2.5" fill="#c9c9cc"/><path d="M4 6l2.2 2L4 10M7.5 10.5h4" fill="none" stroke="#1e1e1f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

let sel = null;
let activeChat = null;

window.setSidebarHidden = (hidden) => {
  $("#toolbar").style.paddingLeft = hidden ? "104px" : "23px";
  document.querySelector("#chatcard").style.borderTopLeftRadius = hidden ? "13px" : "13px";
};

window.setSel = (s, chatId) => {
  sel = s;
  activeChat = chatId || (s && s.chats && s.chats[0] && s.chats[0].id) || null;
  render();
};

function chatOf() { return ((sel && sel.chats) || []).find((c) => c.id === activeChat) || null; }

function render() {
  const chat = chatOf();
  const label = sel ? (sel.title || sel.worktree || "") : "";
  const m = /^(\p{Extended_Pictographic}️?)\s*(.*)$/u.exec(label);
  $("#toolbar").innerHTML = sel ? `
    <span class="stat ${chat && chat.alive ? "up" : ""}"></span>
    <span class="pbadge" style="background:hsl(${sel.hue ?? 210} 24% 26%);color:hsl(${sel.hue ?? 210} 25% 76%)">${esc(sel.letter || "R")}<span class="agent">${ICON.claude(11)}</span></span>
    <span class="crumb">${m ? esc(m[1]) + " " + esc(m[2]) : esc(label)}</span>
    ${chat ? `<span class="chev">›</span><span class="crumb2">${esc(chat.name)}</span>` : ""}
    ${sel.local && sel.local.uncommitted ? `<span class="odot"></span>` : ""}
    <span class="grow" data-drag></span>
    <div class="pills">
      <div class="pill mono" title="Where this worktree runs">${sel.host === "box" ? "agent box" : "Mac"}</div>
      <div class="pill" data-act="ide" title="Open in IDE">${ICON.cube}<span class="dd" data-act="idemenu">${ICON.chev}</span></div>
      <div class="pill" data-act="run" title="Test on Mac / start stack">${ICON.play}<span class="dd" data-act="runmenu">${ICON.chev}</span></div>
    </div>` : `<span class="grow" data-drag></span>`;

  const chats = (sel && sel.chats) || [];
  $("#tabs").innerHTML = chats.map((c) => `<div class="tab ${c.id === activeChat ? "on" : ""}" data-chat="${c.id}">${ICON.claude(14)}<span class="t">${esc(c.name)}</span></div>`).join("")
    + (chats.length ? `<div class="tsep"></div>` : "")
    + (sel && sel.host === "box" ? `<div class="newtab" data-act="new" title="New chat">${ICON.claude(14)}<span style="margin:-8px 0 0 -9px">${ICON.plus}</span>${ICON.chev}</div>` : "")
    + `<span class="grow" data-drag></span><div class="hist" title="Session history">${ICON.clock}</div>`;
  $("#chatempty").innerHTML = !sel ? "Select a worktree" : chats.length ? "" : sel.host === "mac"
    ? "This worktree's chat runs in super.engineering." : "No chat in this worktree yet.<br>Start one with the button above.";
  $("#chatempty").style.display = chats.length ? "none" : "grid";

  const n = sel && sel.local && sel.local.uncommitted;
  $("#branchbar").innerHTML = sel ? `
    <span class="bico">${ICON.branch}</span><span class="bname">${esc(sel.branch || "detached")}</span><span class="bico">${ICON.sync}</span>
    <span class="grow"></span>
    ${n ? `<span class="dirty">${n} uncommitted change${n === 1 ? "" : "s"}</span>` : ""}
    ${chat && n ? `<div class="btn" data-act="commit">${ICON.commit}Commit and push<span style="margin-left:2px;transform:rotate(180deg)">${ICON.chev}</span></div>` : ""}
    ${chat && chat.host === "box" ? `<div class="btn plain" data-run='${esc(JSON.stringify(["chat", "move", chat.id, "--to", "mac"]))}'>Move chat to Mac</div>` : ""}
    ${chat && chat.host === "mac" ? `<div class="btn plain" data-run='${esc(JSON.stringify(["chat", "move", chat.id, "--to", "box"]))}'>Move chat to box</div>` : ""}` : "";

  $("#ptabs").innerHTML = `<div class="ptab on">Terminal</div><span class="padd" title="New terminal">+</span><span class="grow"></span>${ICON.term}<span style="color:#77777b;margin-left:8px">${ICON.chev}</span>`;
  $("#termempty").textContent = !sel ? "" : sel.term ? "" : sel.host === "mac" ? "Mac worktrees open in your IDE or Terminal." : "";
  $("#termempty").style.display = sel && sel.term ? "none" : "grid";
  report();
}

// Native views (the claude.ai chat, the ttyd terminal) sit over the two holes;
// interactive toolbar bits are reported so the rest of the bar drags the window.
function rect(el) { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; }
function report() {
  const hits = [...document.querySelectorAll("#toolbar [data-act], #toolbar .pill, #tabs [data-chat], #tabs [data-act], #branchbar .btn")].map(rect);
  post({ type: "layout", chat: rect($("#chathole")), term: rect($("#termhole")), toolbar: rect($("#toolbar")), hits });
}
new ResizeObserver(report).observe(document.body);
window.addEventListener("resize", report);

// Drag the branch bar to resize chat vs terminal.
let drag = null;
$("#branchbar").addEventListener("mousedown", (e) => {
  if (e.target.closest(".btn")) return;
  drag = { y: e.clientY, split: parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--split")) };
});
window.addEventListener("mousemove", (e) => {
  if (!drag) return;
  const total = $("#chatcard").offsetHeight + $("#termcard").offsetHeight;
  const split = Math.min(0.9, Math.max(0.2, drag.split + (e.clientY - drag.y) / total));
  document.documentElement.style.setProperty("--split", split);
  store.set("split", split);
  report();
});
window.addEventListener("mouseup", () => (drag = null));
document.documentElement.style.setProperty("--split", store.get("split", 0.7));

function toast(text, ms = 6000) {
  const t = $("#toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast.t);
  if (ms) toast.t = setTimeout(() => (t.hidden = true), ms);
}
window.agentboxResult = (r) => {
  const out = (r.output || "").trim().split("\n").filter(Boolean).pop();
  toast(out || (r.code === 0 ? "Done" : "Failed"), r.code === 0 ? 7000 : 20000);
};

function menu(x, y, entries) {
  document.querySelectorAll(".menu").forEach((m) => m.remove());
  const m = document.createElement("div");
  m.className = "menu";
  m.style.left = Math.min(x, innerWidth - 210) + "px";
  m.style.top = y + "px";
  m.innerHTML = entries.map((e, i) => `<div data-i="${i}">${esc(e[0])}</div>`).join("");
  m.addEventListener("click", (ev) => { const i = ev.target.dataset.i; if (i !== undefined) entries[i][1](); m.remove(); });
  document.body.appendChild(m);
  setTimeout(() => window.addEventListener("click", () => m.remove(), { once: true }), 0);
}
function run(args) { toast("Working…", 0); post({ type: "run", args, reqId: String(Date.now()) }); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-chat],[data-act],[data-run]");
  if (!t || !sel) return;
  const r = t.getBoundingClientRect();
  if (t.dataset.chat) {
    activeChat = t.dataset.chat;
    render();
    post({ type: "tab", chat: chatOf() });
  } else if (t.dataset.run) {
    run(JSON.parse(t.dataset.run));
  } else if (t.dataset.act === "new") {
    post({ type: "newchat", dir: sel.path });
  } else if (t.dataset.act === "ide") {
    post({ type: "open", url: sel.ide });
  } else if (t.dataset.act === "idemenu") {
    e.stopPropagation();
    menu(r.left - 150, r.bottom + 6, [
      ["Open in Cursor", () => post({ type: "open", url: sel.ide.replace(/^[a-z]+:/, "cursor:") })],
      ["Open in VS Code", () => post({ type: "open", url: sel.ide.replace(/^[a-z]+:/, "vscode:") })],
    ]);
  } else if (t.dataset.act === "run" || t.dataset.act === "runmenu") {
    e.stopPropagation();
    const chat = chatOf();
    const items = [];
    if (sel.host === "box" && sel.branch && !sel.is_primary) items.push(["Test on Mac", () => run(["chat", "test-local", "--branch", sel.branch])]);
    if (chat && chat.host === "mac" && chat.branch) items.push(["Start stack on Mac", () => run(["chat", "stack-start", chat.id])]);
    if (!items.length) items.push(["Nothing to run here", () => {}]);
    menu(r.left - 150, r.bottom + 6, items);
  } else if (t.dataset.act === "commit") {
    const chat = chatOf();
    if (chat) post({ type: "send", chat: chat.id, text: "Commit and push your changes." });
  }
});
render();
</script>
</body>
</html>
